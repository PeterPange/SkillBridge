<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>员工工作台 — SkillBridge</title>
<style>
  :root { --bg:#fafafa; --panel:#fff; --border:#e4e4e7; --text:#18181b; --muted:#71717a; --accent:#2563eb; --good:#16a34a; --warn:#d97706; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:-apple-system,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif; background:var(--bg); color:var(--text); font-size:14px; line-height:1.6; }
  header { background:var(--panel); border-bottom:1px solid var(--border); padding:12px 24px; display:flex; align-items:center; gap:14px; position:sticky; top:0; z-index:10; }
  header h1 { font-size:16px; font-weight:600; }
  header a.back { color:var(--muted); font-size:13px; text-decoration:none; }
  header select { border:1px solid var(--border); border-radius:8px; padding:6px 10px; font-size:13px; background:var(--panel); }
  .wrap { max-width:1080px; margin:0 auto; padding:20px 24px 60px; display:flex; flex-direction:column; gap:18px; }
  .hero { background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:22px 26px; display:flex; align-items:center; gap:30px; flex-wrap:wrap; }
  .hero .who h2 { font-size:19px; font-weight:600; }
  .hero .who p { color:var(--muted); font-size:13px; }
  .hero .ready { margin-left:auto; text-align:right; }
  .hero .ready .num { font-size:34px; font-weight:700; color:var(--accent); }
  .hero .ready .label { font-size:12px; color:var(--muted); }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); gap:18px; }
  .card { background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:18px 20px; }
  .card h3 { font-size:13px; color:var(--muted); font-weight:600; text-transform:uppercase; letter-spacing:1px; margin-bottom:12px; }
  .skill-row { display:flex; align-items:center; gap:10px; padding:5px 0; }
  .skill-row .name { width:150px; font-size:13px; }
  .skill-row .bars { flex:1; display:flex; gap:3px; }
  .skill-row .bars i { width:22px; height:8px; border-radius:2px; background:var(--border); }
  .skill-row .bars i.on { background:var(--accent); }
  .skill-row .bars i.req { outline:1px dashed var(--muted); outline-offset:1px; }
  .skill-row .tag { font-size:11px; color:var(--muted); width:64px; text-align:right; }
  .skill-row .tag.met { color:var(--good); }
  .gap-item { padding:9px 0; border-bottom:1px solid var(--border); }
  .gap-item:last-child { border-bottom:none; }
  .gap-item .top { display:flex; justify-content:space-between; font-size:13px; }
  .gap-item .top b { font-weight:600; }
  .gap-item .top .cat { color:var(--muted); font-size:12px; }
  .gap-item .top .cat.core { color:var(--warn); }
  .gap-item .note { color:var(--muted); font-size:12px; }
  .course { padding:12px 0; border-bottom:1px solid var(--border); }
  .course:last-child { border-bottom:none; }
  .course .t { display:flex; justify-content:space-between; align-items:baseline; gap:8px; }
  .course .t b { font-size:14px; font-weight:600; cursor:pointer; }
  .course .t b:hover { color:var(--accent); }
  .course .t a { color:var(--accent); font-size:12px; text-decoration:none; white-space:nowrap; }
  .course .meta { color:var(--muted); font-size:12px; margin:2px 0 4px; }
  .course .why { font-size:12px; color:var(--text); background:var(--bg); border-radius:6px; padding:7px 10px; }
  .week { margin-bottom:10px; }
  .week .w { font-weight:600; font-size:13px; margin-bottom:4px; color:var(--accent); }
  .week ul { list-style:none; }
  .week li { padding:4px 0 4px 12px; border-left:2px solid var(--border); font-size:13px; }
  .week li span { color:var(--muted); font-size:12px; }
  .week li b.learn-link { cursor:pointer; }
  .week li b.learn-link:hover { color:var(--accent); }
  .stat-row { display:flex; gap:26px; flex-wrap:wrap; }
  .stat .v { font-size:22px; font-weight:600; }
  .stat .l { font-size:12px; color:var(--muted); }
  .qa-row { display:flex; gap:10px; }
  .qa-row input { flex:1; border:1px solid var(--border); border-radius:8px; padding:9px 12px; font-size:13px; background:var(--bg); }
  .qa-row input:focus { outline:none; border-color:var(--accent); }
  button { border:1px solid var(--accent); background:var(--accent); color:#fff; border-radius:8px; padding:9px 18px; font-size:13px; cursor:pointer; }
  button:hover { opacity:.9; }
  button.ghost-btn { background:transparent; color:var(--accent); }
  .answer { border:1px solid var(--border); border-radius:8px; padding:12px 14px; background:var(--bg); margin-top:10px; font-size:13px; }
  .answer .src { color:var(--muted); font-size:11px; margin-top:4px; }
  .complete-form { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:10px; }
  .complete-form select, .complete-form input { border:1px solid var(--border); border-radius:8px; padding:8px 10px; font-size:13px; }
  .result-box { border:1px solid var(--border); border-radius:8px; padding:12px 14px; background:var(--bg); font-size:13px; }
  .empty { color:var(--muted); text-align:center; padding:16px 0; font-size:13px; }
  .loading { color:var(--muted); text-align:center; padding:40px 0; }
  /* 站内学习视图 */
  .learn-head { display:flex; align-items:center; gap:14px; margin-bottom:14px; }
  .learn-head h2 { font-size:18px; flex:1; }
  .learn-head .progress-label { color:var(--muted); font-size:13px; }
  .learn-layout { display:grid; grid-template-columns:220px 1fr; gap:18px; }
  .unit-nav { background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:12px; align-self:start; }
  .unit-nav .u { padding:7px 10px; border-radius:8px; font-size:13px; cursor:pointer; color:var(--text); display:flex; gap:6px; }
  .unit-nav .u:hover { background:var(--bg); }
  .unit-nav .u.active { background:var(--accent); color:#fff; }
  .unit-nav .u.done { color:var(--good); }
  .unit-nav .u.done.active { color:#fff; }
  .reader { background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:24px 28px; }
  .reader h2 { font-size:17px; margin-bottom:14px; }
  .reader p { font-size:14px; margin-bottom:12px; color:var(--text); }
  .reader .actions { margin-top:18px; display:flex; gap:10px; }
  .quiz-q { background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:18px 20px; margin-bottom:14px; }
  .quiz-q h4 { font-size:14px; margin-bottom:10px; }
  .quiz-q label { display:block; padding:8px 12px; border:1px solid var(--border); border-radius:8px; margin-bottom:6px; font-size:13px; cursor:pointer; }
  .quiz-q label:hover { border-color:var(--accent); }
  .quiz-q input { margin-right:8px; }
  .result-big { text-align:center; padding:30px 0; }
  .result-big .score { font-size:44px; font-weight:700; }
  .result-big .score.pass { color:var(--good); }
  .result-big .score.fail { color:var(--bad); }
</style>
</head>
<body>
<header>
  <h1>员工工作台</h1>
  <select id="who" onchange="loadHome()"></select>
  <a class="back" href="/">切换角色</a>
</header>
<div class="wrap" id="wrap"><div class="loading">加载中</div></div>
<script>
let currentId = null;

const $ = id => document.getElementById(id);

async function api(path, opts) {
  const res = await fetch(path, opts);
  if (!res.ok) throw new Error((await res.json().catch(()=>({}))).detail || res.statusText);
  return res.json();
}

async function init() {
  const list = await api('/api/hr/home').catch(()=>null);
  const members = list ? list.members : [];
  const sel = $('who');
  sel.innerHTML = members.map(m => `<option value="${m.employee_id}">${m.name} · ${m.current_position}</option>`).join('');
  if (members.length) { currentId = members[0].employee_id; sel.value = currentId; loadHome(); }
}

function selectEmployee() { currentId = $('who').value; loadHome(); }

async function loadHome() {
  currentId = $('who').value || currentId;
  if (!currentId) return;
  $('wrap').innerHTML = '<div class="loading">加载中</div>';
  try {
    const d = await api(`/api/employee/me/${currentId}/home`);
    render(d);
  } catch (e) { $('wrap').innerHTML = `<div class="empty">加载失败:${e.message}</div>`; }
}

function bars(level, required) {
  let html = '';
  for (let i = 1; i <= 4; i++) {
    const on = i <= level ? ' on' : '';
    const req = required && i === required && i > level ? ' req' : '';
    html += `<i class="${on}${req}"></i>`;
  }
  return html;
}

function render(d) {
  const p = d.progress;
  const nextCourses = d.plan.flatMap(w => w.courses.map(c => ({ id: c.course_id, name: c.name })));
  const seen = new Set();
  const unique = nextCourses.filter(c => !seen.has(c.id) && seen.add(c.id));
  $('wrap').innerHTML = `
  <div class="hero">
    <div class="who">
      <h2>${d.employee.name}</h2>
      <p>${d.current_position} → 目标岗位:${d.target_position}</p>
    </div>
    <div class="ready">
      <div class="num">${d.readiness_percent}%</div>
      <div class="label">岗位准备度</div>
    </div>
  </div>

  <div class="grid">
    <div class="card">
      <h3>我的能力画像</h3>
      ${d.skills.map(s => `
        <div class="skill-row">
          <span class="name">${s.name}</span>
          <span class="bars">${bars(s.level, s.required_level)}</span>
          <span class="tag ${s.status === 'met' ? 'met' : ''}">${s.status_label}</span>
        </div>`).join('')}
    </div>

    <div class="card">
      <h3>待提升能力</h3>
      ${d.top_gaps.length ? d.top_gaps.map(g => `
        <div class="gap-item">
          <div class="top"><b>${g.skill}</b><span class="cat ${g.is_core ? 'core' : ''}">${g.summary}</span></div>
          <div class="note">当前 ${g.current} 级,目标 ${g.required} 级 · ${g.suggestion}</div>
        </div>`).join('') : '<div class="empty">目标岗位能力已全部达标</div>'}
    </div>
  </div>

  <div class="grid">
    <div class="card">
      <h3>为我推荐的课程</h3>
      ${d.recommendations.map(r => `
        <div class="course">
          <div class="t"><b onclick="openCourse('${r.course_id || ''}')">${r.name}</b><a href="${r.url}" target="_blank">源站</a></div>
          <div class="meta">${r.difficulty} · ${r.duration_label}${r.covers.length ? ' · 补齐:' + r.covers.join('、') : ''}</div>
          <div class="why">${r.reasons[0] || ''}</div>
        </div>`).join('') || '<div class="empty">暂无推荐</div>'}
    </div>

    <div class="card">
      <h3>我的学习计划</h3>
      ${d.plan.map(w => `
        <div class="week">
          <div class="w">第 ${w.week} 周</div>
          <ul>${w.courses.map(c => `<li><b class="learn-link" onclick="openCourse('${c.course_id}')">${c.name}</b> <span>(${c.minutes} 分钟${c.continued ? ' · 跨周延续' : ''})</span></li>`).join('')}</ul>
        </div>`).join('') || '<div class="empty">暂无需排课</div>'}
    </div>
  </div>

  <div class="grid">
    <div class="card">
      <h3>学习进度</h3>
      <div class="stat-row">
        <div class="stat"><div class="v">${p.completed_count}</div><div class="l">已完成课程</div></div>
        <div class="stat"><div class="v">${p.average_score ?? '—'}</div><div class="l">考试均分</div></div>
        <div class="stat"><div class="v">${p.current_week} / ${p.total_weeks}</div><div class="l">计划进度(周)</div></div>
        <div class="stat"><div class="v" style="font-size:14px;padding-top:6px">${p.next_course || '计划已全部完成'}</div><div class="l">下一门</div></div>
      </div>
      <div style="margin-top:16px">
        <h3 style="margin-bottom:8px">登记课程完成</h3>
        <div class="complete-form">
          <select id="fb-course">${unique.map(c => `<option value="${c.id}">${c.name}</option>`).join('')}</select>
          <input id="fb-score" type="number" min="0" max="100" value="85" style="width:90px" />
          <button onclick="submitComplete()">提交</button>
        </div>
        <div id="fb-result"></div>
      </div>
    </div>

    <div class="card">
      <h3>学习资源中心 <span class="tag" id="res-count"></span></h3>
      <div id="res-body"><div class="empty">加载中</div></div>
    </div>

    <div class="card">
      <h3>技能测评 <span class="tag">度量能力 · 联动推荐</span></h3>
      <div id="asm-skills"><div class="empty">加载中</div></div>
      <div id="asm-history"></div>
      <div id="asm-quiz"></div>
    </div>
  </div>

  <div class="grid">
    <div class="card">
      <h3>培训问答</h3>
      <div class="qa-row">
        <input id="qa-input" placeholder="例如:转岗培训建议几周完成?" onkeydown="if(event.key==='Enter')ask()" />
        <button onclick="ask()">提问</button>
      </div>
      <div id="qa-answer"></div>
    </div>
  </div>`;
  loadResources();
  loadAssessments();
}

async function submitComplete() {
  const courseId = $('fb-course').value;
  const score = Number($('fb-score').value);
  try {
    const r = await api(`/api/employee/me/${currentId}/complete`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ course_id: courseId, score })
    });
    const changes = r.changes.map(c => `${c.skill}:${c.from_level} → ${c.to_level}`).join(' · ');
    $('fb-result').innerHTML = `<div class="result-box">
      ${r.passed ? '已完成并记录。' : '未通过,建议巩固后重考。'}
      ${changes ? '<br>等级变化:' + changes : ''}
      ${r.suggestions.map(s => `<br>建议:${s.course}(${s.reason})`).join('')}
    </div>`;
    setTimeout(loadHome, 800);
  } catch (e) { $('fb-result').innerHTML = `<div class="result-box">提交失败:${e.message}</div>`; }
}

async function ask() {
  const q = $('qa-input').value.trim();
  if (!q) return;
  $('qa-answer').innerHTML = '<div class="loading">思考中</div>';
  try {
    const r = await api('/api/knowledge/ask', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ question: q })
    });
    if (!r.answered) { $('qa-answer').innerHTML = '<div class="answer">知识库中暂无相关内容</div>'; return; }
    $('qa-answer').innerHTML = r.passages.map((p,i) => `
      <div class="answer">
        <b>${p.doc_title}${p.heading ? ' — ' + p.heading : ''}</b>
        <div style="margin-top:4px">${p.content.replace(/</g,'&lt;')}</div>
        <div class="src">来源:${p.source_name}</div>
      </div>`).join('');
  } catch (e) { $('qa-answer').innerHTML = `<div class="answer">问答失败:${e.message}</div>`; }
}

// ─── 资源中心 + 技能测评 ────────────────────────────
async function loadResources() {
  try {
    const d = await api(`/api/employee/me/${currentId}/resources`);
    $('res-count').textContent = `视频 ${d.counts.video || 0} · 教材 ${d.counts.module || 0} · 文档 ${d.counts.document || 0}`;
    const card = r => `
      <div class="course">
        <div class="t"><b>${r.title}</b><a href="${r.url}" target="_blank">打开</a></div>
        <div class="meta">${r.type_label}${r.meta['UP主'] ? ' · ' + r.meta['UP主'] : ''}${r.meta['时长'] ? ' · ' + r.meta['时长'] : ''}${r.meta['难度'] ? ' · ' + r.meta['难度'] : ''}${r.meta['单元数'] ? ' · ' + r.meta['单元数'] + ' 单元' : ''}</div>
        ${r.skills.length ? `<div class="why">关联技能:${r.skills.join('、')}</div>` : ''}
      </div>`;
    let html = '';
    if (d.recommended.length) {
      html += `<p style="font-size:12px;color:var(--muted);margin-bottom:8px">按你的能力缺口推荐</p>`;
      html += d.recommended.slice(0, 4).map(card).join('');
    }
    const tabs = [
      ['video', '视频'], ['module', '教材'], ['document', '文档'],
    ];
    for (const [type, label] of tabs) {
      const list = d[type === 'video' ? 'videos' : type === 'module' ? 'modules' : 'documents'] || [];
      if (!list.length) continue;
      html += `<p style="font-size:12px;color:var(--muted);margin:10px 0 4px">全部${label}(${list.length})</p>`;
      html += list.slice(0, 3).map(card).join('');
    }
    $('res-body').innerHTML = html || '<div class="empty">暂无资源(先运行爬虫)</div>';
  } catch (e) { $('res-body').innerHTML = `<div class="empty">${e.message}</div>`; }
}

let asmState = null;  // {skillId, quiz}

async function loadAssessments() {
  try {
    const d = await api(`/api/employee/me/${currentId}/assessments`);
    const skills = d.skills || [];
    $('asm-skills').innerHTML = skills.length ? skills.slice(0, 6).map(s => `
      <div class="gap-item">
        <div class="top"><b>${s.skill_name}</b>
          <span class="cat">当前 ${s.current_level} 级 · ${s.course_count} 门课可考${s.last_score != null ? ' · 最近 ' + s.last_score + ' 分' : ''}</span></div>
        <button class="ghost-btn" style="margin-top:6px;padding:5px 12px;font-size:12px" onclick="startAssessment('${s.skill_id}')">开始测评</button>
      </div>`).join('') : '<div class="empty">暂无可测评技能</div>';
    const history = d.history || [];
    $('asm-history').innerHTML = history.length ? `
      <p style="font-size:12px;color:var(--muted);margin-top:12px">测评历史(Evidence)</p>` +
      history.slice(0, 4).map(h => `<div class="reason">${h.skill_name}:${h.score} 分(${h.verdict_label})</div>`).join('') : '';
  } catch (e) { $('asm-skills').innerHTML = `<div class="empty">${e.message}</div>`; }
}

async function startAssessment(skillId) {
  $('asm-quiz').innerHTML = '<div class="empty">出题中</div>';
  try {
    const q = await api(`/api/employee/me/${currentId}/assessments/${skillId}/quiz`);
    asmState = { skillId, quiz: q };
    $('asm-quiz').innerHTML = `
      ${q.questions.map((question, qi) => `
      <div class="quiz-q">
        <h4>${qi + 1}. ${question.question}</h4>
        ${question.options.map((opt, oi) => `<label><input type="radio" name="asm${qi}" value="${oi}" />${opt}</label>`).join('')}
      </div>`).join('')}
      <button onclick="submitAssessment()">提交测评</button>`;
    $('asm-quiz').scrollIntoView({ behavior: 'smooth' });
  } catch (e) { $('asm-quiz').innerHTML = `<div class="empty">${e.message}</div>`; }
}

async function submitAssessment() {
  const answers = asmState.quiz.questions.map((_, qi) => {
    const checked = document.querySelector(`input[name=asm${qi}]:checked`);
    return checked ? Number(checked.value) : -1;
  });
  try {
    const r = await api(`/api/employee/me/${currentId}/assessments/${asmState.skillId}/submit`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ answers })
    });
    $('asm-quiz').innerHTML = `
      <div class="result-big">
        <div class="score ${r.verdict !== 'failed' ? 'pass' : 'fail'}">${r.score} 分</div>
        <p>${r.skill_name} · ${r.verdict_label} · 答对 ${r.correct}/${r.total}</p>
        <p style="color:var(--muted)">${r.message}</p>
        ${r.recommended_courses.length ? `<p style="color:var(--warn)">推荐课程:${r.recommended_courses.join('、')}</p>` : ''}
      </div>`;
    loadAssessments();
  } catch (e) { alert('提交失败:' + e.message); }
}

// ─── 站内学习 ───────────────────────────────────────
let learnState = null;  // {courseId, view, currentUnit}
async function openCourse(courseId) {
  if (!courseId || !currentId) return;
  $('wrap').innerHTML = '<div class="loading">加载课程内容</div>';
  try {
    const view = await api(`/api/employee/me/${currentId}/courses/${courseId}`);
    learnState = { courseId, view, currentUnit: 0 };
    for (let i = 0; i < view.units.length; i++) {
      if (!view.units[i].completed) { learnState.currentUnit = i; break; }
    }
    renderLearning();
  } catch (e) {
    $('wrap').innerHTML = `<div class="empty">${e.message}<br><button onclick="loadHome()" style="margin-top:10px">返回工作台</button></div>`;
  }
}

function renderLearning() {
  const { view, currentUnit } = learnState;
  const unit = view.units[currentUnit];
  const allDone = view.completed_units === view.total_units;
  $('wrap').innerHTML = `
  <div class="learn-head">
    <button class="ghost-btn" onclick="loadHome()">返回</button>
    <h2>${view.course_name}</h2>
    <span class="progress-label">已学 ${view.completed_units} / ${view.total_units} 单元${view.already_passed ? ' · 已通过结业' : ''}</span>
  </div>
  <div class="learn-layout">
    <div class="unit-nav">
      ${view.units.map((u, i) => `
        <div class="u ${i === currentUnit ? 'active' : ''} ${u.completed ? 'done' : ''}" onclick="switchUnit(${i})">
          ${u.completed ? '✓ ' : ''}${i + 1}. ${u.title.slice(0, 14)}
        </div>`).join('')}
      ${allDone && !view.already_passed ? `<button style="width:100%;margin-top:10px" onclick="startQuiz()">开始结业测验</button>` : ''}
      ${view.already_passed ? '<div class="empty" style="padding:8px 0">已完成本课程</div>' : ''}
    </div>
    <div class="reader">
      <h2>${unit.title}</h2>
      ${unit.paragraphs.map(p => `<p>${p.replace(/</g, '&lt;')}</p>`).join('')}
      <div class="actions">
        ${!unit.completed ? `<button onclick="completeUnit(${currentUnit})">完成本单元</button>` : '<span style="color:var(--good);font-size:13px">本单元已完成</span>'}
        ${currentUnit > 0 ? '<button class="ghost-btn" onclick="switchUnit(' + (currentUnit - 1) + ')">上一单元</button>' : ''}
        ${currentUnit < view.units.length - 1 ? `<button class="ghost-btn" onclick="switchUnit(${currentUnit + 1})">下一单元</button>` : ''}
      </div>
    </div>
  </div>`;
}

function switchUnit(i) { learnState.currentUnit = i; renderLearning(); }

async function completeUnit(i) {
  const unit = learnState.view.units[i];
  try {
    const r = await api(`/api/employee/me/${currentId}/courses/${learnState.courseId}/units/${unit.index}/complete`, { method: 'POST' });
    learnState.view.completed_units = r.completed_units;
    learnState.view.units[i].completed = true;
    learnState.view.quiz_unlocked = r.quiz_unlocked;
    if (i + 1 < learnState.view.units.length) { learnState.currentUnit = i + 1; }
    renderLearning();
  } catch (e) { alert('标记失败:' + e.message); }
}

async function startQuiz() {
  $('wrap').innerHTML = '<div class="loading">生成结业测验</div>';
  try {
    const q = await api(`/api/employee/me/${currentId}/courses/${learnState.courseId}/quiz`);
    learnState.quiz = q;
    renderQuiz();
  } catch (e) { $('wrap').innerHTML = `<div class="empty">${e.message}</div>`; }
}

function renderQuiz() {
  const q = learnState.quiz;
  $('wrap').innerHTML = `
  <div class="learn-head">
    <button class="ghost-btn" onclick="openCourse('${learnState.courseId}')">返回课程</button>
    <h2>结业测验</h2>
    <span class="progress-label">达标线 ${q.pass_threshold} 分 · 通过后自动登记</span>
  </div>
  ${q.questions.map((question, qi) => `
    <div class="quiz-q">
      <h4>${qi + 1}. ${question.question}</h4>
      ${question.options.map((opt, oi) => `<label><input type="radio" name="q${qi}" value="${oi}" />${opt}</label>`).join('')}
    </div>`).join('')}
  <button onclick="submitQuiz()">提交答卷</button>`;
}

async function submitQuiz() {
  const q = learnState.quiz;
  const answers = q.questions.map((_, qi) => {
    const checked = document.querySelector(`input[name=q${qi}]:checked`);
    return checked ? Number(checked.value) : -1;
  });
  try {
    const r = await api(`/api/employee/me/${currentId}/courses/${learnState.courseId}/quiz/submit`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ answers })
    });
    const changes = r.changes.map(c => `${c.skill}:${c.from_level} → ${c.to_level}`).join(' · ');
    $('wrap').innerHTML = `
    <div class="result-big">
      <div class="score ${r.passed ? 'pass' : 'fail'}">${r.score} 分</div>
      <p style="margin:10px 0">答对 ${r.correct}/${r.total} · ${r.message}</p>
      ${changes ? `<p style="color:var(--good)">能力提升:${changes}</p>` : ''}
      ${r.suggestions.map(s => `<p style="color:var(--warn)">建议:${s.course}(${s.reason})</p>`).join('')}
      <div style="margin-top:20px"><button onclick="loadHome()">返回工作台</button></div>
    </div>`;
  } catch (e) { alert('提交失败:' + e.message); }
}

init();
</script>
</body>
</html>
