<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SkillBridge — 企业员工能力发展平台</title>
<style>
  :root { --bg:#fafafa; --panel:#fff; --border:#e4e4e7; --text:#18181b; --muted:#71717a; --accent:#2563eb; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:-apple-system,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif; background:var(--bg); color:var(--text); font-size:14px; line-height:1.6; min-height:100vh; display:flex; flex-direction:column; }
  header { background:var(--panel); border-bottom:1px solid var(--border); padding:14px 24px; display:flex; align-items:baseline; gap:12px; }
  header h1 { font-size:17px; font-weight:600; }
  header span { color:var(--muted); font-size:12px; }
  main { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:40px 20px; }
  main h2 { font-size:22px; font-weight:600; margin-bottom:6px; }
  main p.sub { color:var(--muted); margin-bottom:36px; }
  .roles { display:flex; gap:20px; flex-wrap:wrap; justify-content:center; }
  .role { width:300px; background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:26px 24px; cursor:pointer; transition:border-color .15s, box-shadow .15s; text-decoration:none; color:var(--text); display:block; }
  .role:hover { border-color:var(--accent); box-shadow:0 4px 16px rgba(37,99,235,.08); }
  .role h3 { font-size:17px; margin-bottom:8px; }
  .role p { color:var(--muted); font-size:13px; margin-bottom:14px; }
  .role ul { list-style:none; }
  .role li { font-size:13px; color:var(--text); padding:3px 0; }
  .role li::before { content:"— "; color:var(--muted); }
  footer { padding:16px; text-align:center; color:var(--muted); font-size:12px; }
</style>
</head>
<body>
<header><h1>SkillBridge</h1><span>企业员工智能培训与能力发展平台</span></header>
<main>
  <h2>选择你的角色</h2>
  <p class="sub">不同角色看到不同的工作台</p>
  <div class="roles">
    <a class="role" href="/employee">
      <h3>员工</h3>
      <p>我要提升能力、完成转岗目标</p>
      <ul>
        <li>我的能力画像与目标岗位</li>
        <li>为我推荐的课程与学习计划</li>
        <li>学习进度与培训问答</li>
      </ul>
    </a>
    <a class="role" href="/hr">
      <h3>HR 管理者</h3>
      <p>我要掌握团队能力全貌、评估培训效果</p>
      <ul>
        <li>团队岗位准备度分布</li>
        <li>团队能力缺口分析</li>
        <li>员工培训档案与效果统计</li>
      </ul>
    </a>
  </div>
</main>
<footer>SkillBridge v1.0 · 能力差距分析 · 个性化推荐 · 自适应学习路径 · 培训反馈闭环</footer>
</body>
</html>
