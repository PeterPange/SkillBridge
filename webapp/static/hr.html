<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>HR 管理台 — SkillBridge</title>
<style>
  :root { --bg:#fafafa; --panel:#fff; --border:#e4e4e7; --text:#18181b; --muted:#71717a; --accent:#2563eb; --good:#16a34a; --warn:#d97706; --bad:#dc2626; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:-apple-system,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif; background:var(--bg); color:var(--text); font-size:14px; line-height:1.6; }
  header { background:var(--panel); border-bottom:1px solid var(--border); padding:0 24px; position:sticky; top:0; z-index:20; }
  .header-row { display:flex; align-items:center; gap:14px; padding:12px 0; }
  header h1 { font-size:16px; font-weight:600; }
  header a.back { color:var(--muted); font-size:13px; text-decoration:none; margin-left:auto; }
  nav.tabs { display:flex; gap:4px; overflow-x:auto; }
  nav.tabs button { border:none; background:transparent; color:var(--muted); padding:10px 16px; font-size:14px; cursor:pointer; border-bottom:2px solid transparent; white-space:nowrap; border-radius:0; }
  nav.tabs button:hover { color:var(--text); opacity:1; }
  nav.tabs button.active { color:var(--accent); border-bottom-color:var(--accent); font-weight:600; }
  .wrap { max-width:1080px; margin:0 auto; padding:20px 24px 80px; }
  .page { display:none; flex-direction:column; gap:18px; }
  .page.active { display:flex; }
  .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:14px; }
  .stat { background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:16px 20px; }
  .stat .v { font-size:28px; font-weight:700; }
  .stat .l { font-size:12px; color:var(--muted); }
  .stat.good .v { color:var(--good); }
  .stat.warn .v { color:var(--warn); }
  .stat.bad .v { color:var(--bad); }
  .card { background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:18px 20px; }
  .card h3 { font-size:13px; color:var(--muted); font-weight:600; text-transform:uppercase; letter-spacing:1px; margin-bottom:12px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); gap:18px; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th { text-align:left; color:var(--muted); font-weight:500; padding:6px 8px; border-bottom:1px solid var(--border); }
  td { padding:8px; border-bottom:1px solid var(--border); }
  tr:last-child td { border-bottom:none; }
  .pill { display:inline-block; border-radius:999px; padding:1px 10px; font-size:12px; border:1px solid; }
  .pill.ready { color:var(--good); border-color:var(--good); }
  .pill.close { color:var(--warn); border-color:var(--warn); }
  .pill.far { color:var(--bad); border-color:var(--bad); }
  .bar { height:6px; background:var(--border); border-radius:3px; overflow:hidden; min-width:80px; }
  .bar > i { display:block; height:100%; background:var(--accent); border-radius:3px; }
  .gap-row { display:flex; align-items:center; gap:12px; padding:7px 0; border-bottom:1px solid var(--border); }
  .gap-row:last-child { border-bottom:none; }
  .gap-row .name { width:170px; font-size:13px; font-weight:500; }
  .gap-row .name .core { color:var(--warn); font-size:11px; }
  .gap-row .bar { flex:1; }
  .gap-row .num { width:110px; text-align:right; color:var(--muted); font-size:12px; }
  .qa-row { display:flex; gap:10px; }
  .qa-row input { flex:1; border:1px solid var(--border); border-radius:8px; padding:9px 12px; font-size:13px; background:var(--bg); }
  .qa-row input:focus { outline:none; border-color:var(--accent); }
  button.btn { border:1px solid var(--accent); background:var(--accent); color:#fff; border-radius:8px; padding:9px 18px; font-size:13px; cursor:pointer; }
  button.btn:hover { opacity:.9; }
  .answer { border:1px solid var(--border); border-radius:8px; padding:12px 14px; background:var(--bg); margin-top:10px; font-size:13px; }
  .answer .src { color:var(--muted); font-size:11px; margin-top:4px; }
  .loading { color:var(--muted); text-align:center; padding:40px 0; }
  .empty { color:var(--muted); text-align:center; padding:16px 0; font-size:13px; }
  .recent li { padding:5px 0; font-size:13px; border-bottom:1px solid var(--border); list-style:none; }
  .recent li:last-child { border-bottom:none; }
  .recent li span { color:var(--muted); font-size:12px; }
</style>
</head>
<body>
<header>
  <div class="header-row">
    <h1>HR 管理台</h1>
    <a class="back" href="/">切换角色</a>
  </div>
  <nav class="tabs" id="tabs">
    <button data-tab="overview" class="active" onclick="switchTab('overview')">团队总览</button>
    <button data-tab="members" onclick="switchTab('members')">员工档案</button>
    <button data-tab="training" onclick="switchTab('training')">培训效果</button>
    <button data-tab="assessment" onclick="switchTab('assessment')">测评统计</button>
    <button data-tab="qa" onclick="switchTab('qa')">政策问答</button>
  </nav>
</header>
<div class="wrap">
  <div class="page active" id="page-overview"><div class="loading">加载中</div></div>
  <div class="page" id="page-members"></div>
  <div class="page" id="page-training"></div>
  <div class="page" id="page-assessment"></div>
  <div class="page" id="page-qa"></div>
</div>
<script>
const $ = id => document.getElementById(id);
let hrData = null;

async function api(path, opts) {
  const res = await fetch(path, opts);
  if (!res.ok) throw new Error((await res.json().catch(()=>({}))).detail || res.statusText);
  return res.json();
}

function switchTab(name) {
  for (const b of $('tabs').children) b.classList.toggle('active', b.dataset.tab === name);
  for (const p of document.querySelectorAll('.page')) p.classList.remove('active');
  $('page-' + name).classList.add('active');
  if (name === 'assessment' && !$('page-assessment').innerHTML) loadAssessmentStats();
}

async function load() {
  try {
    hrData = await api('/api/hr/home');
    renderOverview(); renderMembers(); renderTraining(); renderQA();
  } catch (e) { $('page-overview').innerHTML = `<div class="empty">加载失败:${e.message}</div>`; }
}

function renderOverview() {
  const d = hrData;
  $('page-overview').innerHTML = `
  <div class="stats">
    <div class="stat"><div class="v">${d.team_size}</div><div class="l">在培员工</div></div>
    <div class="stat"><div class="v">${d.average_readiness}%</div><div class="l">团队平均准备度</div></div>
    <div class="stat good"><div class="v">${d.buckets.ready}</div><div class="l">已达标</div></div>
    <div class="stat warn"><div class="v">${d.buckets.close}</div><div class="l">接近达标</div></div>
    <div class="stat bad"><div class="v">${d.buckets.far}</div><div class="l">差距较大</div></div>
  </div>

  <div class="grid">
    <div class="card">
      <h3>团队能力缺口排行 <span class="tag">核心技能缺口建议优先安排资源</span></h3>
      ${d.top_team_gaps.map(g => `
        <div class="gap-row">
          <span class="name">${g.skill}${g.is_core ? ' <span class="core">核心</span>' : ''}</span>
          <span class="bar"><i style="width:${g.coverage_percent}%"></i></span>
          <span class="num">${g.lacking_count}/${g.team_size} 人待补</span>
        </div>`).join('') || '<div class="empty">暂无缺口数据</div>'}
    </div>

    <div class="card">
      <h3>培训概况</h3>
      <div class="stats" style="grid-template-columns:repeat(3,1fr);gap:10px">
        <div class="stat" style="border:none;padding:6px"><div class="v" style="font-size:20px">${d.training.total_completions}</div><div class="l">累计完成</div></div>
        <div class="stat" style="border:none;padding:6px"><div class="v" style="font-size:20px">${d.training.pass_rate ?? '—'}${d.training.pass_rate != null ? '%' : ''}</div><div class="l">通过率</div></div>
        <div class="stat" style="border:none;padding:6px"><div class="v" style="font-size:20px">${d.training.average_score ?? '—'}</div><div class="l">考试均分</div></div>
      </div>
      <ul class="recent" style="margin-top:12px">
        ${d.training.recent.slice(0, 5).map(r => `<li>${r.employee} 完成 ${r.course_id} · ${r.score} 分 ${r.passed ? '' : '(未通过)'}<span>${(r.at || '').slice(0, 10)}</span></li>`).join('') || '<li class="empty">暂无培训记录</li>'}
      </ul>
    </div>
  </div>`;
}

function renderMembers() {
  const d = hrData;
  $('page-members').innerHTML = `
  <div class="card">
    <h3>员工培训档案 <span class="tag">${d.team_size} 人</span></h3>
    <table>
      <tr><th>员工</th><th>部门</th><th>当前 → 目标岗位</th><th>准备度</th><th>状态</th><th>已完成</th><th>考试均分</th></tr>
      ${d.members.map(m => `
        <tr>
          <td><b>${m.name}</b></td>
          <td>${m.department}</td>
          <td>${m.current_position} → ${m.target_position}</td>
          <td><span class="bar"><i style="width:${m.readiness_percent}%"></i></span></td>
          <td><span class="pill ${m.bucket}">${m.bucket_label}</span></td>
          <td>${m.completed_courses} 门</td>
          <td>${m.average_score ?? '—'}</td>
        </tr>`).join('')}
    </table>
  </div>`;
}

function renderTraining() {
  const t = hrData.training;
  $('page-training').innerHTML = `
  <div class="stats">
    <div class="stat"><div class="v">${t.total_completions}</div><div class="l">累计完成课程</div></div>
    <div class="stat"><div class="v">${t.pass_rate ?? '—'}${t.pass_rate != null ? '%' : ''}</div><div class="l">结业通过率</div></div>
    <div class="stat"><div class="v">${t.average_score ?? '—'}</div><div class="l">考试平均分</div></div>
  </div>
  <div class="card">
    <h3>最近培训动态</h3>
    <ul class="recent">
      ${t.recent.map(r => `<li>${r.employee} 完成 ${r.course_id} · ${r.score} 分 ${r.passed ? '' : '(未通过)'}<span>${(r.at || '').slice(0, 10)}</span></li>`).join('') || '<li class="empty">暂无培训记录</li>'}
    </ul>
  </div>`;
}

function renderQA() {
  $('page-qa').innerHTML = `
  <div class="card">
    <h3>政策与知识问答 <span class="tag">企业知识库检索</span></h3>
    <div class="qa-row">
      <input id="qa-input" placeholder="例如:转岗培训的报销政策是什么?" onkeydown="if(event.key==='Enter')ask()" />
      <button class="btn" onclick="ask()">提问</button>
    </div>
    <div id="qa-answer"></div>
  </div>`;
}

async function loadAssessmentStats() {
  try {
    const d = await api('/api/hr/assessments');
    if (!d.total) {
      $('page-assessment').innerHTML = '<div class="card"><div class="empty">暂无测评记录,员工可在工作台发起技能测评</div></div>';
      return;
    }
    $('page-assessment').innerHTML = `
    <div class="stats">
      <div class="stat"><div class="v">${d.total}</div><div class="l">累计测评</div></div>
      <div class="stat"><div class="v">${d.average_score}</div><div class="l">平均分</div></div>
      <div class="stat"><div class="v">${d.pass_rate}%</div><div class="l">通过率</div></div>
    </div>
    <div class="card">
      <h3>分技能测评统计</h3>
      ${d.by_skill.map(s => `
        <div class="gap-row">
          <span class="name">${s.skill}</span>
          <span class="bar"><i style="width:${s.pass_rate}%"></i></span>
          <span class="num">${s.attempts} 次 · 均分 ${s.average}</span>
        </div>`).join('')}
    </div>`;
  } catch (e) { $('page-assessment').innerHTML = `<div class="empty">${e.message}</div>`; }
}

async function ask() {
  const q = $('qa-input').value.trim();
  if (!q) return;
  $('qa-answer').innerHTML = '<div class="loading">思考中</div>';
  try {
    const r = await api('/api/knowledge/ask', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ question: q })
    });
    if (!r.answered) { $('qa-answer').innerHTML = '<div class="answer">知识库中暂无相关内容</div>'; return; }
    $('qa-answer').innerHTML = r.passages.map(p => `
      <div class="answer">
        <b>${p.doc_title}${p.heading ? ' — ' + p.heading : ''}</b>
        <div style="margin-top:4px">${p.content.replace(/</g,'&lt;')}</div>
        <div class="src">来源:${p.source_name}</div>
      </div>`).join('');
  } catch (e) { $('qa-answer').innerHTML = `<div class="answer">问答失败:${e.message}</div>`; }
}

load();
</script>
</body>
</html>
