[project]
name = "skillbridge"
version = "0.1.0"
description = "SkillBridge AI —— 企业员工智能培训与能力发展 Agent 平台"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.21",
    "neo4j>=5.26,<6",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "python-dotenv>=1.0",
    # 技能归一化:本地 Embedding 模型(阶段 1B)。
    # 未安装时 skill_normalization 自动降级为词面相似度,不影响其余模块。
    "sentence-transformers>=3.0",
    # torch 为 sentence-transformers 的推理后端,显式声明以便固定 CPU 轮子来源。
    "torch>=2.2",
    "pypdf>=6.19.0",
    "python-docx>=1.2.0",
    "langgraph>=1.2.12",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# 顶层包布局与 README.md 项目结构一致。
# platform/ 为 Web 端目录,暂无 Python 代码(且避免遮蔽标准库 platform 模块),不参与打包。
packages = [
    "skillbridge",
    "data",
    "skill_normalization",
    "knowledge_graph",
    "profile",
    "recommendation",
    "learning_path",
    "rag",
    "agent",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
# 顶层包 profile/ 与标准库 profile 模块同名，把仓库根插入 sys.path 首位，
# 保证测试导入的是本地 profile 包而不是标准库性能分析器。
pythonpath = ["."]

# torch 仅用于 sentence-transformers 的 CPU 推理,固定从 PyTorch 官方 CPU 索引
# 安装,避免拉取数 GB 的 NVIDIA CUDA 依赖。
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
