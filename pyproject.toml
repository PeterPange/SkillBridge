[project]
name = "skillbridge"
version = "0.1.0"
description = "SkillBridge AI —— 企业员工智能培训与能力发展 Agent 平台"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.21",
    "neo4j>=5.26,<6",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# 顶层包布局与 README.md 项目结构一致。
# platform/ 为 Web 端目录,暂无 Python 代码(且避免遮蔽标准库 platform 模块),不参与打包。
packages = [
    "skillbridge",
    "data",
    "skill_normalization",
    "knowledge_graph",
    "profile",
    "recommendation",
    "learning_path",
    "rag",
    "agent",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
